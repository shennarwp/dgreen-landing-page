name: Sitemap lastmod

# Keeps sitemap.xml <lastmod> accurate without manual edits.
# On PRs that touch a page, refreshes that page's lastmod to today (UTC)
# and commits the result back to the PR branch.
#
# Why PRs and not push-to-master: the protect-master ruleset blocks direct
# pushes (admins bypass; github-actions does not), so committing straight
# to master would be rejected. PR branches are writable for GITHUB_TOKEN.
# Loop safety: the follow-up push finds sitemap already current and commits
# nothing, so the workflow terminates after one extra run.

on:
  pull_request:
    branches: [master]
    paths:
      - 'index.html'
      - 'id/index.html'

jobs:
  lastmod:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Refresh lastmod for changed pages
        run: |
          git fetch origin ${{ github.base_ref }} --depth=100
          python3 - <<'EOF'
          import re
          import subprocess
          from datetime import date, timezone

          PAGE_URLS = {
              'index.html': 'https://dgreenniravakuta.com/',
              'id/index.html': 'https://dgreenniravakuta.com/id/',
          }

          changed = subprocess.run(
              ['git', 'diff', '--name-only', 'origin/${{ github.base_ref }}...HEAD'],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          today = date.today().isoformat()  # runner clock is UTC
          with open('sitemap.xml', encoding='utf-8') as f:
              sitemap = f.read()

          updated = []
          for path, url in PAGE_URLS.items():
              if path in changed:
                  pattern = re.compile(
                      r'(<loc>' + re.escape(url) + r'</loc>\s*<lastmod>)[^<]*?(</lastmod>)'
                  )
                  sitemap, n = pattern.subn(r'\g<1>' + today + r'\g<2>', sitemap)
                  if n:
                      updated.append(url)

          if updated:
              with open('sitemap.xml', 'w', encoding='utf-8') as f:
                  f.write(sitemap)
              print('Updated lastmod to', today, 'for:', ', '.join(updated))
          else:
              print('No sitemap changes needed.')
          EOF

      - name: Commit back to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: refresh sitemap lastmod [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
